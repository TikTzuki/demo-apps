<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>🧧 Vòng Quay Lì Xì Tết 2025</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&family=Baloo+2:wght@600;800&display=swap"
          rel="stylesheet">
    <style>
        :root {
            --red: #c0392b;
            --dark-red: #922b21;
            --gold: #f4c542;
            --bright-gold: #ffd700;
            --dark: #1a0000;
            --light-gold: #fff3b0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Baloo 2', cursive;
            overflow-x: hidden;
            position: relative;
            padding: 1rem;
        }

        .lantern {
            position: fixed;
            font-size: 2rem;
            animation: swing 3s ease-in-out infinite;
            filter: drop-shadow(0 0 8px #f4c542);
            pointer-events: none;
        }

        .lantern:nth-child(1) {
            top: 10px;
            left: 5%;
            animation-delay: 0s;
        }

        .lantern:nth-child(2) {
            top: 10px;
            right: 5%;
            animation-delay: 0.5s;
        }

        .lantern:nth-child(3) {
            top: 10px;
            left: 20%;
            animation-delay: 1s;
            font-size: 1.5rem;
        }

        .lantern:nth-child(4) {
            top: 10px;
            right: 20%;
            animation-delay: 1.5s;
            font-size: 1.5rem;
        }

        @keyframes swing {
            0%, 100% {
                transform: rotate(-8deg);
            }
            50% {
                transform: rotate(8deg);
            }
        }

        .petal {
            position: fixed;
            animation: fall linear infinite;
            opacity: 0.7;
            pointer-events: none;
        }

        @keyframes fall {
            0% {
                transform: translateY(-20px) rotate(0deg);
                opacity: 0.7;
            }
            100% {
                transform: translateY(110vh) rotate(360deg);
                opacity: 0;
            }
        }

        h1 {
            font-family: 'Noto Serif', serif;
            color: var(--bright-gold);
            font-size: clamp(1.3rem, 4vw, 1.9rem);
            text-align: center;
            margin-bottom: 1.2rem;
            text-shadow: 0 0 20px #f4c542, 0 2px 0 #8b0000;
            letter-spacing: 2px;
        }

        /* SETUP SCREEN */
        #setupScreen {
            display: flex;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .setup-box {
            background: linear-gradient(135deg, #7b0000, #c0392b);
            border: 2px solid var(--bright-gold);
            border-radius: 20px;
            padding: 1.5rem 1.8rem;
            width: min(360px, 90vw);
            box-shadow: 0 0 30px rgba(244, 197, 66, 0.25);
        }

        .setup-label {
            color: var(--bright-gold);
            font-size: 1rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 1rem;
            letter-spacing: 1px;
        }

        .name-input-row {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 0.6rem;
        }

        .name-input-row .num {
            color: var(--bright-gold);
            font-size: 1rem;
            font-weight: 700;
            min-width: 22px;
            text-align: center;
        }

        .name-input-row input {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border: 1.5px solid rgba(255, 215, 0, 0.4);
            border-radius: 10px;
            padding: 0.5rem 0.8rem;
            color: #fff;
            font-family: 'Baloo 2', cursive;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .name-input-row input:focus {
            border-color: var(--bright-gold);
        }

        .name-input-row input::placeholder {
            color: rgba(255, 255, 255, 0.35);
        }

        .start-btn {
            width: 100%;
            background: linear-gradient(135deg, #c0392b, #e74c3c);
            color: white;
            border: 2px solid var(--bright-gold);
            padding: 0.75rem;
            font-family: 'Baloo 2', cursive;
            font-size: 1.1rem;
            font-weight: 800;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 1rem;
            transition: transform 0.2s;
            box-shadow: 0 4px 15px rgba(192, 57, 43, 0.4);
            letter-spacing: 1px;
        }

        .start-btn:hover {
            transform: scale(1.03);
        }

        .start-btn:active {
            transform: scale(0.97);
        }

        /* GAME SCREEN */
        #gameScreen {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            animation: fadeIn 0.5s ease;
        }

        .current-player-badge {
            background: rgba(255, 215, 0, 0.12);
            border: 1.5px solid var(--bright-gold);
            border-radius: 30px;
            padding: 0.35rem 1.4rem;
            color: var(--bright-gold);
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 1rem;
            letter-spacing: 1px;
        }

        /* Player selector */
        .player-selector {
            width: min(360px, 90vw);
            background: rgba(255, 215, 0, 0.08);
            border: 1.5px solid rgba(255, 215, 0, 0.35);
            border-radius: 16px;
            padding: 0.8rem 1rem;
            margin-bottom: 0.9rem;
        }

        .selector-label {
            color: var(--bright-gold);
            font-size: 0.82rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 0.6rem;
            letter-spacing: 0.5px;
        }

        .selector-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            justify-content: center;
        }

        .player-chip {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            background: rgba(0, 0, 0, 0.25);
            border: 1.5px solid rgba(255, 215, 0, 0.3);
            border-radius: 30px;
            padding: 0.35rem 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
            color: var(--light-gold);
            font-size: 0.88rem;
            font-weight: 600;
            user-select: none;
        }

        .player-chip:hover {
            border-color: var(--bright-gold);
            background: rgba(255, 215, 0, 0.1);
        }

        .player-chip.selected {
            background: linear-gradient(135deg, #c0392b, #e74c3c);
            border-color: var(--bright-gold);
            color: #fff;
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.3);
        }

        .player-chip.done {
            opacity: 0.3;
            cursor: not-allowed;
            pointer-events: none;
            text-decoration: line-through;
        }

        .player-chip .chip-check {
            font-size: 0.9rem;
        }

        .selected-badge {
            background: rgba(255, 215, 0, 0.12);
            border: 1.5px solid var(--bright-gold);
            border-radius: 30px;
            padding: 0.35rem 1.4rem;
            color: var(--bright-gold);
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 0.8rem;
            letter-spacing: 1px;
            animation: popIn 0.3s ease;
        }

        .wheel-container {
            position: relative;
            width: min(320px, 82vw);
            height: min(320px, 82vw);
            margin-bottom: 1.2rem;
        }

        #wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 6px solid var(--bright-gold);
            box-shadow: 0 0 30px rgba(244, 197, 66, 0.5), inset 0 0 20px rgba(0, 0, 0, 0.3);
        }

        .pointer {
            position: absolute;
            top: 50%;
            right: -20px;
            transform: translateY(-50%);
            width: 0;
            height: 0;
            border-top: 18px solid transparent;
            border-bottom: 18px solid transparent;
            border-right: 34px solid var(--bright-gold);
            filter: drop-shadow(0 0 6px var(--gold));
            z-index: 10;
        }

        .center-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 48px;
            height: 48px;
            background: radial-gradient(circle, #ffd700, #c0392b);
            border-radius: 50%;
            border: 3px solid #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.8);
            z-index: 5;
            cursor: pointer;
        }

        #spinBtn {
            background: linear-gradient(135deg, #c0392b, #e74c3c);
            color: white;
            border: 3px solid var(--bright-gold);
            padding: 0.75rem 2rem;
            font-family: 'Baloo 2', cursive;
            font-size: 1.05rem;
            font-weight: 800;
            border-radius: 50px;
            cursor: pointer;
            letter-spacing: 1px;
            box-shadow: 0 4px 20px rgba(192, 57, 43, 0.5);
            transition: all 0.2s;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
        }

        #spinBtn:hover {
            transform: scale(1.05);
        }

        #spinBtn:active {
            transform: scale(0.97);
        }

        #spinBtn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .result-panel {
            margin-top: 0.9rem;
            background: linear-gradient(135deg, #7b0000, #c0392b);
            border: 2px solid var(--bright-gold);
            border-radius: 16px;
            padding: 0.8rem 1.8rem;
            text-align: center;
            min-width: 220px;
            box-shadow: 0 0 25px rgba(244, 197, 66, 0.3);
            display: none;
        }

        .result-panel.show {
            display: block;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .result-emoji {
            font-size: 1.6rem;
            margin-bottom: 0.2rem;
        }

        .result-name {
            color: var(--light-gold);
            font-size: 0.85rem;
            margin-bottom: 0.2rem;
        }

        .result-amount {
            color: var(--bright-gold);
            font-size: 1.8rem;
            font-weight: 800;
            text-shadow: 0 0 12px rgba(255, 215, 0, 0.6);
        }

        .result-wish {
            color: #fff3b0;
            font-size: 0.82rem;
            margin-top: 0.5rem;
            line-height: 1.4;
            font-style: italic;
            opacity: 0.9;
        }

        .result-wish {
            color: #fff;
            font-size: 0.88rem;
            margin-top: 0.5rem;
            line-height: 1.5;
            font-style: italic;
            opacity: 0.92;
            border-top: 1px solid rgba(255, 215, 0, 0.25);
            padding-top: 0.5rem;
        }

        /* Result table */
        .history-box {
            margin-top: 0.9rem;
            width: min(360px, 90vw);
            background: rgba(255, 215, 0, 0.07);
            border: 1.5px solid rgba(255, 215, 0, 0.3);
            border-radius: 14px;
            overflow: hidden;
            display: none;
        }

        .history-title {
            background: rgba(255, 215, 0, 0.15);
            color: var(--bright-gold);
            font-size: 0.82rem;
            font-weight: 700;
            text-align: center;
            padding: 0.4rem;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(255, 215, 0, 0.2);
        }

        .history-table {
            width: 100%;
            border-collapse: collapse;
        }

        .history-table td {
            padding: 0.38rem 0.9rem;
            font-size: 0.88rem;
            border-bottom: 1px solid rgba(255, 215, 0, 0.1);
        }

        .history-table tr:last-child td {
            border-bottom: none;
        }

        .history-table td.status-cell {
            text-align: center;
            width: 32px;
        }

        .history-table td.name-cell {
            font-weight: 700;
            color: var(--light-gold);
        }

        .history-table td.amount-cell {
            text-align: right;
            font-weight: 800;
        }

        .history-table tr.pending td {
            opacity: 0.35;
            color: var(--light-gold);
        }

        .history-table tr.pending td.amount-cell {
            color: var(--light-gold);
        }

        .history-table tr.current td.name-cell {
            color: var(--bright-gold);
        }

        .history-table tr.current td.amount-cell {
            color: rgba(255, 215, 0, 0.4);
        }

        .history-table tr.done td.amount-cell {
            color: var(--bright-gold);
        }

        .history-table tr.done td.name-cell {
            color: var(--light-gold);
        }

        .reset-btn {
            background: transparent;
            color: var(--gold);
            border: 1px solid var(--gold);
            padding: 0.4rem 1.2rem;
            font-family: 'Baloo 2', cursive;
            font-size: 0.85rem;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 0.8rem;
            opacity: 0.75;
            transition: opacity 0.2s;
            display: none;
        }

        .reset-btn:hover {
            opacity: 1;
        }

        .confetti-piece {
            position: fixed;
            animation: confettiFall 2s ease-in forwards;
            pointer-events: none;
            z-index: 100;
            border-radius: 2px;
        }

        @keyframes confettiFall {
            0% {
                transform: translateY(-100px) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) rotate(720deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

<div class="lantern">🏮</div>
<div class="lantern">🏮</div>
<div class="lantern">🧧</div>
<div class="lantern">🧧</div>

<!-- SETUP SCREEN -->
<div id="setupScreen">
    <h1>🧧 Vòng Quay Lì Xì 🧧</h1>
    <div class="setup-box">
        <p class="setup-label">✍️ Nhập tên 5 người chơi</p>
        <div id="nameInputs"></div>
        <button class="start-btn" onclick="startGame()">🎋 Bắt đầu quay!</button>
    </div>
</div>

<!-- GAME SCREEN -->
<div id="gameScreen">
    <h1>🧧 Vòng Quay Lì Xì 🧧</h1>
    <!-- Player selector -->
    <div class="player-selector" id="playerSelector">
        <div class="selector-label">👆 Bạn là ai? Tick vào tên trước khi quay!</div>
        <div class="selector-list" id="selectorList"></div>
    </div>
    <div class="selected-badge" id="selectedBadge" style="display:none"></div>

    <div class="wheel-container">
        <canvas id="wheel"></canvas>
        <div class="pointer"></div>
        <div class="center-circle" onclick="spin()">🎋</div>
    </div>

    <button id="spinBtn" onclick="spin()">🎉 QUAY NGAY!</button>

    <div class="result-panel" id="resultPanel">
        <div class="result-emoji" id="resultEmoji">🧧</div>
        <div class="result-name" id="resultName"></div>
        <div class="result-amount" id="resultAmount"></div>
        <div class="result-wish" id="resultWish"></div>
        <div class="result-wish" id="resultWish"></div>
    </div>

    <div class="history-box" id="historyBox">
        <div class="history-title">🏆 BẢNG KẾT QUẢ</div>
        <table class="history-table" id="historyTable"></table>
    </div>

    <button class="reset-btn" id="resetBtn" onclick="resetGame()">🔄 Chơi lại</button>
</div>

<script>
    // Petals
    const petals = ['🌸', '🌺', '✨', '🍀'];
    for (let i = 0; i < 12; i++) {
        const el = document.createElement('div');
        el.className = 'petal';
        el.textContent = petals[Math.floor(Math.random() * petals.length)];
        el.style.left = Math.random() * 100 + 'vw';
        el.style.animationDuration = (4 + Math.random() * 6) + 's';
        el.style.animationDelay = (Math.random() * 5) + 's';
        el.style.fontSize = (0.8 + Math.random() * 0.8) + 'rem';
        document.body.appendChild(el);
    }

    // Build name inputs
    const COUNT = 5;
    const TOTAL = 200000;
    const placeholders = ['Mr. Lộc', 'Mr. Thiện', 'Mr. Tân', 'Mr. Long', 'Mr. Huy'];
    const defaultNames = ['Mr. Lộc', 'Mr. Thiện', 'Mr. Tân', 'Mr. Long', 'Mr. Huy'];
    const nameInputsEl = document.getElementById('nameInputs');
    for (let i = 0; i < COUNT; i++) {
        const row = document.createElement('div');
        row.className = 'name-input-row';
        row.innerHTML = `<span class="num">${i + 1}.</span><input type="text" id="name${i}" placeholder="${placeholders[i]}" value="${defaultNames[i]}" maxlength="20">`;
        nameInputsEl.appendChild(row);
    }

    // State
    let playerNames = [];
    let amountsCopy = [];
    let remaining = COUNT;
    let spinning = false;
    let currentAngle = 0;
    let results = [];       // amounts in order spun
    let playerDone = [];    // bool per player index
    let playerResults = []; // amount per player index

    // Canvas
    const canvas = document.getElementById('wheel');
    const ctx = canvas.getContext('2d');

    const segments = [
        {label: 'Chúc mừng!', color: '#c0392b'},
        {label: 'May mắn!', color: '#7b241c'},
        {label: 'Phát tài!', color: '#e74c3c'},
        {label: 'Sung túc!', color: '#922b21'},
        {label: 'Thịnh vượng!', color: '#b03a2e'},
        {label: 'An khang!', color: '#a93226'},
        {label: 'Phúc lộc!', color: '#cd6155'},
        {label: 'Vạn như ý!', color: '#7b241c'},
        {label: 'Sức khỏe!', color: '#c0392b'},
        {label: 'Hạnh phúc!', color: '#e74c3c'},
    ];

    function resizeCanvas() {
        const s = canvas.offsetWidth;
        canvas.width = s;
        canvas.height = s;
        drawWheel(currentAngle);
    }

    function drawWheel(angle) {
        const size = canvas.width;
        ctx.clearRect(0, 0, size, size);
        const cx = size / 2, cy = size / 2, r = size / 2 - 4;
        const n = segments.length;
        const arc = (2 * Math.PI) / n;

        for (let i = 0; i < n; i++) {
            const start = angle + i * arc;
            const end = start + arc;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.arc(cx, cy, r, start, end);
            ctx.closePath();
            ctx.fillStyle = segments[i].color;
            ctx.fill();
            ctx.strokeStyle = '#ffd700';
            ctx.lineWidth = 1.5;
            ctx.stroke();

            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(start + arc / 2);
            ctx.beginPath();
            ctx.moveTo(r * 0.55, -1);
            ctx.lineTo(r * 0.88, -1);
            ctx.strokeStyle = 'rgba(255,215,0,0.35)';
            ctx.lineWidth = 2.5;
            ctx.stroke();
            ctx.restore();

            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(start + arc / 2);
            ctx.textAlign = 'right';
            ctx.fillStyle = '#ffd700';
            ctx.font = `bold ${size * 0.038}px Baloo 2, sans-serif`;
            ctx.shadowColor = 'rgba(0,0,0,0.6)';
            ctx.shadowBlur = 4;
            ctx.fillText(segments[i].label, r * 0.86, 4);
            ctx.restore();
        }

        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, 2 * Math.PI);
        ctx.strokeStyle = '#ffd700';
        ctx.lineWidth = 5;
        ctx.stroke();

        for (let i = 0; i < n * 2; i++) {
            const a = angle + (i * Math.PI) / n;
            ctx.beginPath();
            ctx.arc(cx + (r - 8) * Math.cos(a), cy + (r - 8) * Math.sin(a), 3, 0, 2 * Math.PI);
            ctx.fillStyle = i % 2 === 0 ? '#ffd700' : '#fff';
            ctx.fill();
        }
    }

    // Lucky/prosperous number endings in Vietnamese culture
    // Endings like 68, 86, 88, 66, 99, 168, 888, 668, 369, 689...
    function toLuckyNumber(n) {
        // Lucky endings to aim for (last 2-3 digits)
        const lucky2 = [68, 86, 88, 66, 99, 69, 96, 89, 98, 79, 97, 78, 87, 38, 83, 48, 84, 18, 81, 28, 82];
        const base = Math.floor(n / 100) * 100;
        // pick a lucky ending close to n % 100
        const remainder = n % 100;
        let best = lucky2[0], bestDiff = Infinity;
        for (const l of lucky2) {
            const diff = Math.abs(l - remainder);
            if (diff < bestDiff) {
                bestDiff = diff;
                best = l;
            }
        }
        return base + best;
    }

    function generateAmounts(total, count) {
        // Generate raw random splits first (no rounding)
        const min = 15000;
        let pool = total - min * count;
        let raws = new Array(count).fill(0);
        for (let i = 0; i < count - 1; i++) {
            const maxExtra = pool * 0.65;
            const e = Math.floor(Math.random() * maxExtra);
            raws[i] = e;
            pool -= e;
        }
        raws[count - 1] = pool;
        let amounts = raws.map(e => min + e);

        // Convert each to nearest lucky number
        amounts = amounts.map(a => toLuckyNumber(a));

        // Adjust so sum = total (add/subtract from largest)
        const sum = amounts.reduce((a, b) => a + b, 0);
        const diff = total - sum;
        // find index of largest
        const maxIdx = amounts.indexOf(Math.max(...amounts));
        amounts[maxIdx] += diff;
        // re-lucky the adjusted one if possible
        if (amounts[maxIdx] > 0) amounts[maxIdx] = toLuckyNumber(amounts[maxIdx]);

        // shuffle
        for (let i = amounts.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [amounts[i], amounts[j]] = [amounts[j], amounts[i]];
        }
        return amounts;
    }

    let selectedPlayer = null; // index of currently selected player

    function startGame() {
        playerNames = [];
        for (let i = 0; i < COUNT; i++) {
            const val = document.getElementById(`name${i}`).value.trim();
            playerNames.push(val || `Người ${i + 1}`);
        }
        amountsCopy = generateAmounts(TOTAL, COUNT);
        remaining = COUNT;
        results = [];
        playerDone = new Array(COUNT).fill(false);
        playerResults = new Array(COUNT).fill(null);
        selectedPlayer = null;
        document.getElementById('spinBtn').disabled = true;

        document.getElementById('setupScreen').style.display = 'none';
        const gs = document.getElementById('gameScreen');
        gs.style.display = 'flex';

        setTimeout(() => {
            resizeCanvas();
            renderChips();
            renderTable();
        }, 50);
        window.addEventListener('resize', resizeCanvas);
    }

    function renderChips() {
        const list = document.getElementById('selectorList');
        const doneSet = new Set(results.map((_, i) => i)); // indexes already done by order
        // Track which player indexes have been used
        list.innerHTML = '';
        playerNames.forEach((name, i) => {
            const isDone = playerDone[i];
            const isSelected = selectedPlayer === i;
            const chip = document.createElement('div');
            chip.className = 'player-chip' + (isDone ? ' done' : '') + (isSelected ? ' selected' : '');
            chip.innerHTML = `<span class="chip-check">${isDone ? '✅' : isSelected ? '🎯' : '👤'}</span><span>${name}</span>`;
            if (!isDone) chip.onclick = () => selectPlayer(i);
            list.appendChild(chip);
        });

        // Show/hide selector vs badge
        if (remaining === 0) {
            document.getElementById('playerSelector').style.display = 'none';
            document.getElementById('selectedBadge').style.display = 'none';
        }
    }

    function selectPlayer(i) {
        if (playerDone[i] || remaining === 0) return;
        selectedPlayer = i;
        document.getElementById('selectedBadge').textContent = `🎯 ${playerNames[i]} đang quay...`;
        document.getElementById('selectedBadge').style.display = 'block';
        document.getElementById('spinBtn').disabled = false;
        renderChips();
    }

    function updateBadge() {
        if (remaining === 0) {
            document.getElementById('playerSelector').style.display = 'none';
            document.getElementById('selectedBadge').textContent = '🎊 Tất cả đã quay xong!';
            document.getElementById('selectedBadge').style.display = 'block';
        }
    }

    function renderTable() {
        const tb = document.getElementById('historyTable');
        const box = document.getElementById('historyBox');

        let html = '';
        for (let i = 0; i < COUNT; i++) {
            const isDone = playerDone[i];
            const isCurrent = selectedPlayer === i && !isDone;
            let cls, icon, amountStr;
            if (isDone) {
                cls = 'done';
                icon = '✅';
                amountStr = playerResults[i].toLocaleString('vi-VN') + 'đ';
            } else if (isCurrent) {
                cls = 'current';
                icon = '🎯';
                amountStr = '???';
            } else {
                cls = 'pending';
                icon = '⏳';
                amountStr = '---';
            }
            html += `<tr class="${cls}">
        <td class="status-cell">${icon}</td>
        <td class="name-cell">${playerNames[i]}</td>
        <td class="amount-cell">${amountStr}</td>
      </tr>`;
        }
        tb.innerHTML = html;
        box.style.display = 'block';
    }

    function spin() {
        if (spinning || remaining === 0 || selectedPlayer === null) return;
        spinning = true;
        document.getElementById('spinBtn').disabled = true;
        document.getElementById('resultPanel').classList.remove('show');

        const extraSpins = 5 + Math.floor(Math.random() * 5);
        const targetAngle = currentAngle + (2 * Math.PI * extraSpins) + (Math.random() * 2 * Math.PI);
        const duration = 4000;
        const startTime = performance.now();
        const startAngle = currentAngle;

        function animate(now) {
            const elapsed = now - startTime;
            const t = Math.min(elapsed / duration, 1);
            const ease = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
            currentAngle = startAngle + (targetAngle - startAngle) * ease;
            drawWheel(currentAngle);
            if (t < 1) requestAnimationFrame(animate);
            else {
                spinning = false;
                showResult();
            }
        }

        requestAnimationFrame(animate);
    }

    function showResult() {
        const idx = selectedPlayer;
        const name = playerNames[idx];
        const spinIdx = COUNT - remaining; // which amount slot to use
        const amount = amountsCopy[spinIdx];
        results.push(amount);
        playerDone[idx] = true;
        playerResults[idx] = amount;
        remaining--;
        selectedPlayer = null;

        const emojis = ['🧧', '🎊', '✨', '🌟', '💰', '🍀'];
        const wishes = [
            // Tiền bạc, tài lộc
            '💰 Năm Tỵ rắn vàng đến gõ cửa — xin mời vào, đừng ngại!',
            '🤑 Tiền vào như nước, tiền ra... ờ thôi mình không bàn chuyện đó!',
            '🐍 Rắn năm nay khôn lắm — nó biết bò thẳng vào ví của anh!',
            '💸 Lì xì nhỏ là lộc mở đầu, phần còn lại trời sẽ bù thêm cho!',
            '🍀 Cầm tiền này chắc tay — đây là lộc đầu năm, không phải trả lại đâu nha!',
            // Sức khỏe, bình an
            '🌿 Chúc anh năm mới thân thể cường tráng, không cần gặp bác sĩ trừ khi... đi khám định kỳ thôi!',
            '🌸 Bình an là lộc lớn nhất — tiền nhiều mà bệnh hoài thì cũng chán!',
            '☀️ Chúc ngủ ngon, ăn khỏe, stress ít — sống thọ để tiêu hết số tiền sắp kiếm được!',
            '🧘 Năm mới tâm an, trí sáng — mọi quyết định đều đúng, kể cả lúc quay vòng này!',
            // Công việc, thăng tiến
            '🚀 Chúc năm nay thăng chức nhanh hơn tốc độ sếp... quên mất tên mình!',
            '📈 Cổ phiếu xanh, dự án thắng, sếp khen — năm Tỵ trọn vẹn ba điều này là đủ!',
            '🎯 Chúc mọi mục tiêu đều đạt — trừ mục tiêu thức khuya làm báo cáo, cái đó bỏ đi!',
            '💼 Năm mới công việc suôn sẻ, deadline không dí, họp sáng thứ 2 được cancel dài dài!',
            '🏆 Chúc anh là ngôi sao sáng nhất team — nhưng đừng sáng quá kẻo sếp giao thêm việc!',
            // Gia đình, hạnh phúc
            '🏠 Gia đình bình an, sum vầy — đó mới là tài sản quý hơn lì xì này nhiều lần!',
            '❤️ Chúc cả nhà mạnh khỏe, vui vẻ — Tết nào cũng đầy tiếng cười!',
            '🌺 Hạnh phúc không cần nhiều tiền — nhưng có thêm chút lì xì này cũng không thừa đâu nha!',
            '👨‍👩‍👧 Năm mới gia đình thuận hòa, con cái ngoan ngoãn, ba mẹ khỏe mạnh — đủ cả rồi!',
        ];
        document.getElementById('resultEmoji').textContent = emojis[Math.floor(Math.random() * emojis.length)];
        document.getElementById('resultName').textContent = `${name} nhận được`;
        document.getElementById('resultAmount').textContent = amount.toLocaleString('vi-VN') + 'đ';
        document.getElementById('resultWish').textContent = wishes[Math.floor(Math.random() * wishes.length)];
        document.getElementById('resultPanel').classList.add('show');

        renderChips();
        renderTable();
        updateBadge();
        launchConfetti();

        if (remaining > 0) {
            // disable spin until next person selects themselves
            document.getElementById('spinBtn').disabled = true;
            document.getElementById('spinBtn').textContent = `🎉 QUAY NGAY!`;
            document.getElementById('selectedBadge').style.display = 'none';
        } else {
            document.getElementById('spinBtn').textContent = '🎊 Đã hết lượt!';
            document.getElementById('resetBtn').style.display = 'inline-block';
        }
    }

    function resetGame() {
        window.removeEventListener('resize', resizeCanvas);
        document.getElementById('gameScreen').style.display = 'none';
        document.getElementById('setupScreen').style.display = 'flex';
        document.getElementById('resultPanel').classList.remove('show');
        document.getElementById('resetBtn').style.display = 'none';
        document.getElementById('spinBtn').textContent = '🎉 QUAY NGAY!';
        document.getElementById('spinBtn').disabled = true;
        document.getElementById('historyBox').style.display = 'none';
        document.getElementById('selectedBadge').style.display = 'none';
        document.getElementById('playerSelector').style.display = 'block';
        currentAngle = 0;
        results = [];
        playerDone = [];
        playerResults = [];
        selectedPlayer = null;
    }

    function launchConfetti() {
        const colors = ['#ffd700', '#c0392b', '#e74c3c', '#ff6b6b', '#fff', '#f4c542', '#ff9500'];
        for (let i = 0; i < 60; i++) {
            setTimeout(() => {
                const el = document.createElement('div');
                el.className = 'confetti-piece';
                el.style.left = (15 + Math.random() * 70) + 'vw';
                el.style.top = '0';
                el.style.background = colors[Math.floor(Math.random() * colors.length)];
                el.style.width = (6 + Math.random() * 8) + 'px';
                el.style.height = (6 + Math.random() * 8) + 'px';
                el.style.animationDuration = (1.2 + Math.random() * 1.5) + 's';
                el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
                document.body.appendChild(el);
                setTimeout(() => el.remove(), 3000);
            }, i * 25);
        }
    }
</script>
