services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: checkin-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/checkin?schema=public
    depends_on:
      - db
    restart: unless-stopped

volumes:
  pgdata:
