name: Build and Push Docker Image

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'App to build'
        required: true
        type: choice
        options:
          - checkin
          - firework
          - meeting-room
          - social-commerce
      docker_tag_suffix:
        description: 'Optional tag suffix (default: commit hash)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve Dockerfile path
        id: dockerfile
        run: |
          APP="${{ github.event.inputs.app }}"

          # Default: Dockerfile in app root
          CONTEXT="./$APP"
          DOCKERFILE="./$APP/Dockerfile"

          # Special case: firework uses a nested Dockerfile
          if [ "$APP" = "firework" ]; then
            DOCKERFILE="./$APP/examples/web/Dockerfile"
          fi

          echo "context=$CONTEXT" >> $GITHUB_OUTPUT
          echo "dockerfile=$DOCKERFILE" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          APP="${{ github.event.inputs.app }}"
          COMMIT_HASH=$(git rev-parse --short HEAD)
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/${APP}"

          DOCKER_TAGS="${IMAGE}:${COMMIT_HASH}"

          if [ -n "${{ github.event.inputs.docker_tag_suffix }}" ]; then
            DOCKER_TAGS="${DOCKER_TAGS},${IMAGE}:${{ github.event.inputs.docker_tag_suffix }}"
          fi

          DOCKER_TAGS="${DOCKER_TAGS},${IMAGE}:latest"

          echo "tags=$DOCKER_TAGS" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ steps.dockerfile.outputs.context }}
          file: ${{ steps.dockerfile.outputs.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Image digest
        run: echo "Image pushed with tags ${{ steps.meta.outputs.tags }}"