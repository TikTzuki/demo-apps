<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>my pwd</title>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            background: #0a0a0a;
            color: #e5e7eb;
            font-family: system-ui, -apple-system, sans-serif;
        }

        .wrap {
            display: flex;
            min-height: 100vh;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
        }

        .spin {
            width: 34px;
            height: 34px;
            border: 3px solid #312e81;
            border-top-color: #818cf8;
            border-radius: 50%;
            animation: s 1s linear infinite;
        }

        @keyframes s {
            to {
                transform: rotate(360deg);
            }
        }

        p {
            margin: 0;
            color: #9ca3af;
            font-size: 14px;
        }
    </style>
</head>
<body>
<div class="wrap">
    <div class="spin"></div>
    <p>Starting my pwd…</p>
</div>
</body>
</html>
