services:
  db:
    image: postgres:16-alpine
    container_name: meeting-room-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: meeting_room
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: meeting-room-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/meeting_room?schema=public
      - ADMIN_SECRET=${ADMIN_SECRET:-change-me}
    depends_on:
      - db
    restart: unless-stopped

volumes:
  pgdata:
